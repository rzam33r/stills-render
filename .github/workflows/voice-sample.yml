name: Voice samples

# Speaks a plan's narration with several Kokoro voices and speeds, so a
# voice can be judged by ear before a film depends on it. It runs the film's
# own voice step (engine/voice.py), never a copy of it, so what you hear is
# what a film gets. The samples, and the voice files a film is cut from, go
# on the voice-samples release.

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Plan whose narration to speak'
        required: false
        default: examples/boond-hindi-short-plan.json
      voices:
        description: 'Kokoro voices, separated by spaces'
        required: false
        default: 'hm_omega hm_psi hf_alpha hf_beta'
      speeds:
        description: 'Speeds, separated by spaces (1.0 is normal)'
        required: false
        default: '1.0'

permissions:
  contents: write

jobs:
  speak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Kokoro (exact versions from locks/voice.txt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg
          pip install -q -r locks/voice.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Speak it in each voice and speed, with the film's own voice step
        env:
          PLAN: ${{ inputs.plan }}
          VOICES: ${{ inputs.voices }}
          SPEEDS: ${{ inputs.speeds }}
        run: |
          mkdir -p samples
          name=$(basename "$PLAN" .json); name=${name%-plan}
          for v in $VOICES; do
            for sp in $SPEEDS; do
              python3 - "$v" "$sp" <<'PY'
          import json, os, sys
          plan = json.load(open(os.environ['PLAN'], encoding='utf-8-sig'))
          plan['voice'], plan['speed'] = sys.argv[1], float(sys.argv[2])
          json.dump(plan, open('/tmp/sample-plan.json', 'w'), ensure_ascii=False)
          PY
              out="voice/$name-$v-$sp"
              python3 engine/voice.py /tmp/sample-plan.json "$out"
              ffmpeg -v error -y -i "$out/voice.wav" -c:a aac -b:a 128k "samples/$name-$v-$sp.m4a"
              cp "$out/cuts.json" "samples/$name-$v-$sp-cuts.json"
              cp "$out/voice.wav" "samples/$name-$v-$sp-voice.wav"
              python3 -c "import json; c = json.load(open('$out/cuts.json')); print('$v $sp:', round(c['audio_seconds'], 1), 's,', c['words_without_time'], 'words without a time')" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
      - name: Put the samples on the voice-samples release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view voice-samples >/dev/null 2>&1 || \
            gh release create voice-samples --title voice-samples --notes "Voices to judge by ear." --prerelease
          gh release upload voice-samples samples/* --clobber
