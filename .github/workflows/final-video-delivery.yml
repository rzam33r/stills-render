name: Shared final video delivery
on:
  workflow_call:
    inputs:
      video:
        required: true
        type: string
      project:
        required: true
        type: string
      qa_approved:
        required: true
        type: boolean
      delivery_test:
        default: false
        type: boolean
      artifact_run_id:
        description: >-
          Optional. story-render run id whose video artifact holds the MP4.
          Use this when the video was never committed to the repository.
        required: false
        default: ''
        type: string
      larger_delivery_test:
        # Referenced by the job body, so it must be declared here too or a
        # calling workflow fails at startup before any step runs.
        description: Lossless triple-concat of an existing source, TEST only.
        required: false
        default: false
        type: boolean
    secrets:
      UPLOAD_TOKEN:
        required: true
      DRIVE_ENDPOINT_URL:
        required: true
  workflow_dispatch:
    inputs:
      larger_delivery_test:
        description: Lossless triple-concat existing source for bounded larger-file TEST only
        default: false
        type: boolean
      video:
        description: Checked MP4 repository path
        required: true
        default: output/seed_final_1.mp4
        type: string
      project:
        description: Project slug, used only in unique output name
        required: true
        default: seed-delivery-test
        type: string
      qa_approved:
        description: I confirm picture/audio QA release (or approved existing-file delivery test)
        required: true
        default: false
        type: boolean
      delivery_test:
        description: Label destination as TEST, not new production
        default: true
        type: boolean
      artifact_run_id:
        description: >-
          Optional. story-render run id whose video artifact holds the MP4.
          Use this when the video was never committed to the repository.
        required: false
        default: ''
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: final-delivery-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  deliver:
    if: ${{ inputs.qa_approved }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # a 45-minute film can be close to 1 GB
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the video from its render artifact
        # Renders are no longer committed: git keeps every version of a file
        # for ever, so committed MP4s grow the repository permanently. The
        # render uploads the MP4 as an artifact instead, and this step places
        # it under output/ so the validation below sees an ordinary file.
        if: inputs.artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          # Only the film. The same run also carries the story's pictures and
          # its voice as artifacts; the delivery needs neither.
          pattern: video-*
          path: output
          merge-multiple: true
      - name: Make sure ffmpeg is here
        # This used to run apt-get update and install ffmpeg every time,
        # unconditionally. The runner image already ships ffmpeg, so the
        # work was wasted -- and when apt was slow it ate the whole ten
        # minutes this job is allowed and the job was cancelled part way
        # through. That was reported as "Sent to Google Drive - failed",
        # though Drive had not been reached and nothing was wrong with it.
        #
        # Ask first. Install only if it is genuinely missing, and give that
        # fallback a deadline of its own so a slow mirror fails here, named,
        # instead of silently consuming the delivery's budget.
        timeout-minutes: 4
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
            exit 0
          fi
          echo "ffmpeg missing from the runner image, installing it"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Validate QA release and final MP4, upload original bytes once
        env:
          VIDEO: ${{ inputs.video }}
          PROJECT: ${{ inputs.project }}
          LARGER_TEST: ${{ inputs.larger_delivery_test }}
          IS_TEST: ${{ inputs.delivery_test }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          DRIVE_ENDPOINT_URL: ${{ secrets.DRIVE_ENDPOINT_URL }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import os,re,json,hashlib,pathlib,subprocess,urllib.request,urllib.error
          from datetime import datetime,timezone
          receipt={'state':'FAILED','destination_folder':'1w2wHd9vhqw1QvWdpyjdF-75xJLO3D6_R'}
          try:
            root=pathlib.Path.cwd().resolve(); p=(root/os.environ['VIDEO']).resolve()
            if root not in p.parents or p.suffix.lower()!='.mp4' or not p.is_file(): raise ValueError('MP4 must be an existing repository file')
            project=os.environ['PROJECT']
            if not re.fullmatch(r'[a-z0-9][a-z0-9-]{0,29}',project): raise ValueError('project slug must be 1-30 lowercase letters/digits/hyphens')
            if os.environ.get('LARGER_TEST','').lower()=='true':
              if os.environ['IS_TEST'].lower()!='true': raise ValueError('larger fixture requires TEST label')
              fixture=root/'larger-delivery-fixture.mp4'
              listing=root/'concat-list.txt';listing.write_text(('file '+str(p)+'\n')*3)
              subprocess.run(['ffmpeg','-v','error','-f','concat','-safe','0','-i',str(listing),'-c','copy',str(fixture)],check=True)
              p=fixture
            data=p.read_bytes()
            if not 1000<=len(data)<=256*1024*1024: raise ValueError('receiver permits 1000 bytes to 256 MiB; stopped without reducing quality')
            if data[4:8]!=b'ftyp': raise ValueError('not MP4')
            probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
            kinds={s.get('codec_type') for s in probe.get('streams',[])}
            if not {'audio','video'}<=kinds: raise ValueError('narrated final requires audio AND video; silent test cannot be delivered as final')
            if float(probe.get('format',{}).get('duration',0))<=0: raise ValueError('invalid duration')
            is_test=os.environ['IS_TEST'].lower()=='true'
            # The story first, then the day in Dubai: how-ants-work-together-12-Nov-26.
            # The upload itself is keyed by the run, not the name, so two
            # films with the same name both arrive. The attempt only appears
            # on a retry, and TEST only on a test.
            try:
              from zoneinfo import ZoneInfo
              now=datetime.now(ZoneInfo('Asia/Dubai'))
            except Exception:
              now=datetime.now(timezone.utc)
            day=now.strftime('%d-%b-%y')
            attempt=os.environ['ATTEMPT']
            # A second film of the same story on the same day gets -2, -3...:
            # Drive holds two files of one name side by side, and nobody can
            # tell them apart. The pointer of the last delivery says what went.
            take=''
            try:
              last=json.loads(pathlib.Path(f'delivered/{project}.json').read_text()).get('name') or ''
            except Exception:
              last=''
            stem=f"{project}-{day}"
            if last.startswith(stem):
              m=re.match(re.escape(stem)+r'(?:-(\d+))?(?:-a\d+)?(?:-TEST)?\.mp4$', last)
              if m: take=f"-{int(m.group(1) or 1)+1}"
            name=f"{stem}{take}{'' if attempt=='1' else '-a'+attempt}{'-TEST' if is_test else ''}.mp4"
            sha=hashlib.sha256(data).hexdigest()
            receipt.update(source_path=os.environ['VIDEO'],name=name,source_sha256=sha,source_bytes=len(data),qa_release=True,test=is_test)
            # Every film goes the resumable route, whatever its size. The
            # short route only confirmed the name and byte count, so a film
            # under 30 MB arrived unverified: Drive never checked that the
            # bytes it stored were the bytes that were sent. The resumable
            # route finishes by reading Drive's own SHA-256 back.
            if True:
              key='delivery_'+os.environ['RUN_ID']+'_'+os.environ['ATTEMPT']
              md5=hashlib.md5(data).hexdigest()
              def control(fields):
                fields.update(token=os.environ['UPLOAD_TOKEN'])
                req=urllib.request.Request(os.environ['DRIVE_ENDPOINT_URL'],data=json.dumps(fields).encode(),headers={'Content-Type':'text/plain'},method='POST')
                with urllib.request.urlopen(req,timeout=120) as r: obj=json.loads(r.read())
                if not obj.get('ok'): raise ValueError('receiver control rejected; no automatic re-init')
                return obj
              start=control(dict(op='start',key=key,name=name,size=len(data),sha256=sha,md5=md5))
              if start['state']=='VERIFIED': result=start['file']
              else:
                session=start['url']
                if not session.startswith('https://www.googleapis.com/upload/drive/v3/files?'): raise ValueError('session host/path rejected')
                print('::add-mask::'+session)
                class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*a,**k): return None
                opener=urllib.request.build_opener(NoRedirect)
                def put(chunk,span):
                  req=urllib.request.Request(session,data=chunk,headers={'Content-Type':'video/mp4','Content-Range':span},method='PUT')
                  try:
                    with opener.open(req,timeout=120) as r: return r.status,dict(r.headers),r.read()
                  except urllib.error.HTTPError as e:
                    if e.code!=308: raise ValueError('session upload rejected; no new session')
                    return e.code,dict(e.headers),b''
                def acknowledged(headers):
                  m=re.fullmatch(r'bytes=0-(\d+)',headers.get('Range',headers.get('range','')))
                  return int(m.group(1))+1 if m else 0
                offset=0; probes=0; result=None
                while offset<len(data):
                  end=min(offset+8*1024*1024,len(data))
                  try: code,headers,body=put(data[offset:end],f'bytes {offset}-{end-1}/{len(data)}')
                  except (TimeoutError,urllib.error.URLError):
                    code,headers,body=put(b'',f'bytes */{len(data)}'); probes+=1
                  if code in (200,201): result=json.loads(body);offset=len(data);break
                  nxt=acknowledged(headers)
                  if not offset<nxt<=end: raise ValueError('invalid or stalled acknowledgement; inspect session')
                  offset=nxt
                  if probes==0:
                    # Deliberately close/reopen via independent status request before continuing same session.
                    c,h,b=put(b'',f'bytes */{len(data)}');probes+=1
                    if c!=308 or acknowledged(h)!=offset: raise ValueError('resume status mismatch')
                if not result or not result.get('id'): raise ValueError('completion id absent; inspect same session')
              final=control(dict(op='finish',key=key,id=result['id']))['file']
              receipt.update(state='DESTINATION_SHA256_VERIFIED',drive_id=final['id'],receiver_bytes=int(final['size']),destination_sha256=final['sha256Checksum'],destination_sha256_verified=True,web_view_link=final.get('webViewLink'),resume_status_probes=probes if 'probes' in locals() else 0)
              print('Resumable upload complete; fixed parent, original size, MD5 and SHA256 verified by Drive metadata.')
            else:
              # Fixed destination is configured in the existing receiver, never an input.
              import base64
              payload=json.dumps({'token':os.environ['UPLOAD_TOKEN'],'name':name,'data':base64.b64encode(data).decode()}).encode()
              req=urllib.request.Request(os.environ['DRIVE_ENDPOINT_URL'],data=payload,headers={'Content-Type':'text/plain'},method='POST')
              # One submission only: no automatic retry after an ambiguous write.
              with urllib.request.urlopen(req,timeout=300) as r: result=json.loads(r.read())
              if not result.get('ok'): raise ValueError('receiver rejected delivery')
              if result.get('name')!=name or result.get('size')!=len(data) or not result.get('id'): raise ValueError('receiver receipt mismatch; inspect Drive before retry')
              receipt.update(state='UPLOADED_RECEIPT_VERIFIED',drive_id=result['id'],receiver_bytes=result['size'],destination_sha256_verified=False)
              print('Upload accepted; matching name and byte count. Independent Drive hash readback remains required.')
          except Exception as e:
            # Never print credentials, payload, endpoint or raw provider errors.
            receipt.update(error_type=type(e).__name__)
            print('Delivery failed or is unverified. Inspect receipt and Drive before any retry.')
            raise SystemExit(1)
          finally:
            pathlib.Path('delivery-receipt.json').write_text(json.dumps(receipt,indent=2))
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Shared delivery\n'+json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Keep delivery receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-receipt.json
          retention-days: 7
      - name: Record where the film went
        # A small pointer committed beside the code, so anything holding a
        # repository key can offer "watch it" without needing Google access
        # of its own. The film itself stays in Drive; this is only its address.
        if: success()
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          r = json.loads(pathlib.Path('delivery-receipt.json').read_text())
          drive_id = r.get('drive_id')
          if not drive_id:
              raise SystemExit('no Drive id in the receipt; nothing to record')
          link = r.get('web_view_link') or f'https://drive.google.com/file/d/{drive_id}/view'
          out = pathlib.Path('delivered') / f"{os.environ['PROJECT']}.json"
          out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps({
              'slug': os.environ['PROJECT'],
              'name': r.get('name'),
              'web_view_link': link,
              'drive_id': drive_id,
              'bytes': r.get('receiver_bytes'),
              'verified': bool(r.get('destination_sha256_verified')),
              'state': r.get('state'),
              'run': os.environ['GITHUB_RUN_ID'],
              'at': r.get('at') or '',
          }, indent=2) + '\n')
          print('recorded', out, '->', link)
          PY
          # Base the commit on main as it stands: the render job pushed to it
          # during this same run, so the checked-out commit is already behind.
          git fetch origin main
          git checkout -B deliver-note origin/main
          cp -f "delivered/$PROJECT.json" /tmp/pointer.json 2>/dev/null || true
          mkdir -p delivered && cp -f /tmp/pointer.json "delivered/$PROJECT.json"
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add "delivered/$PROJECT.json"
          git diff --cached --quiet && echo "unchanged" && exit 0
          git commit -m "delivered $PROJECT"
          # The film is already in the Drive folder by now, so a lost race here
          # must not be reported as a failed delivery.
          for try in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main && git rebase --autostash origin/main || git rebase --abort
            sleep $((try * 5))
          done
          echo "the film was delivered; only the pointer file could not be saved"
      - name: Report status separately from render
        if: always()
        run: echo 'This job delivers an already QA-released file. It does not render, mix narration, or certify visual/audio quality.' >> "$GITHUB_STEP_SUMMARY"
  blocked:
    if: ${{ !inputs.qa_approved }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'QA release absent. Nothing uploaded.'; exit 1
