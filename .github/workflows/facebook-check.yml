name: Check the Facebook key

# Run by hand after adding (or replacing) FACEBOOK_TOKEN
# (docs/FACEBOOK-SETUP.md). It asks Meta for the Bittu Ki Riya Page's own
# key and names the Page. It posts nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Sign in and name the Page
        env:
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          FACEBOOK_PAGE_ID: '61596905883436'   # the Bittu Ki Riya Page
        run: python3 engine/facebook.py check
