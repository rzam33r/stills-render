name: Tests

# Runs on every change. The quick checks need no voice: test_render.py makes
# a film from stand-in pictures and a tone for each word, so where every
# picture must start is known exactly, and checks the film frame by frame.
#
# The voice test runs Kokoro itself on the example plan when the voice or
# its timing code changes (or by hand), renders it with stand-in pictures,
# and checks every cut against the words Kokoro reported. Its film is kept
# on the film-example release to watch.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          dpkg -s libfribidi0 >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0; }
          pip install -q -c locks/pictures.txt pillow numpy
          pip install -q pyyaml
      - name: Shots start on their first word
        run: python3 tests/test_timing.py
      - name: The example plan passes the check
        run: python3 engine/check_plan.py examples/north-star-plan.json
      - name: A film is cut on the right frames, and cards fit
        run: python3 tests/test_render.py
      - name: Every music track has its credit
        run: python3 tests/test_music.py
      - name: The workflows keep their rules
        run: python3 tests/test_workflows.py
      - name: The ChatGPT instructions agree with the engine
        run: python3 tests/test_docs.py
      - name: The upload page's check is the tested one, and it works
        run: python3 tests/test_lovable.py

  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Only when the voice changed, or when run by hand
        id: need
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git rev-parse -q --verify HEAD~1 >/dev/null || \
             git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(engine/(voice|timing|render|frames|typeset|check_sync)\.py|locks/voice|examples/)'; then
            echo run=yes >> "$GITHUB_OUTPUT"
          else
            echo "voice untouched; skipping"; echo run=no >> "$GITHUB_OUTPUT"
          fi
      - name: Install the voice
        if: steps.need.outputs.run == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libfribidi0
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg
          pip install -q -r locks/voice.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q -c locks/pictures.txt pillow numpy
      - name: Speak the example and cut a film on its words
        if: steps.need.outputs.run == 'yes'
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'tests')
          from test_render import picture, doodle
          for name in ('north-star', 'rain-short', 'boond-hindi-short'):
              out = pathlib.Path(f'example/pictures-{name}'); out.mkdir(parents=True)
              plan = json.loads(pathlib.Path(f'examples/{name}-plan.json').read_text())
              for s in plan['shots']:
                  if 'picture' in s: picture(out / f"{s['picture']}.png", int(s['picture']))
                  if s.get('doodle'): doodle(out / f"{s['doodle']}.png")
          PY
          for name in north-star rain-short boond-hindi-short; do
            python3 engine/voice.py "examples/$name-plan.json" "example/voice-$name"
            python3 engine/render.py "examples/$name-plan.json" "example/pictures-$name" "example/voice-$name" "example/$name.mp4" \
              --logo brand/watermark.png --music "$(python3 engine/pick_music.py "examples/$name-plan.json" "$GITHUB_RUN_ID")"
            python3 engine/check_sync.py "example/$name.mp4"
          done
          python3 - <<'PY'
          import json
          c = json.load(open('example/voice-north-star/cuts.json'))
          plan = json.load(open('examples/north-star-plan.json'))
          print('voice', c['voice'], f"{c['audio_seconds']:.1f} s;", c['words_without_time'], 'pieces without a time')
          for s, t in zip(plan['shots'], c['starts']):
              print(f'{t:7.2f}  {s["say"][:60]}')
          PY
      - name: The Hindi short with the Azure voice (only when its key is set)
        if: steps.need.outputs.run == 'yes'
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then echo "No Azure key: the Azure voice is not tested."; exit 0; fi
          sudo apt-get install -y -qq libasound2t64 >/dev/null
          pip install -q -r locks/voice-azure.txt
          python3 -c "import json; p=json.load(open('examples/boond-hindi-short-plan.json')); p['voice']='hi-IN-MadhurNeural'; json.dump(p, open('/tmp/azure-plan.json','w'), ensure_ascii=False)"
          python3 engine/voice.py /tmp/azure-plan.json example/voice-azure
          python3 engine/render.py /tmp/azure-plan.json example/pictures-boond-hindi-short example/voice-azure example/boond-hindi-azure.mp4
          python3 engine/check_sync.py example/boond-hindi-azure.mp4
      - name: Keep the example film to watch
        if: steps.need.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view film-example >/dev/null 2>&1 || \
            gh release create film-example --title film-example --notes "The example plan, spoken by Kokoro, with stand-in pictures." --prerelease
          for d in example/voice-*; do
            cp "$d/cuts.json" "example/cuts-${d#example/voice-}.json"
            ffmpeg -v error -y -i "$d/voice.wav" -c:a flac "example/voice-${d#example/voice-}.flac"
          done
          gh release upload film-example example/*.mp4 example/cuts-*.json example/voice-*.flac --clobber
