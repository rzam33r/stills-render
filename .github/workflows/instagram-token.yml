name: Renew the Instagram key

# Every week:
# - a Facebook-kind key (Unified login, the one Meta gives new apps) is only
#   checked: it never expires, so there is nothing to renew and no GitHub
#   key is needed. If Meta ever gives one that expires, this fails 14 days
#   before, and GitHub emails Roshan to make a new one.
# - an Instagram-kind key (older Instagram login) lasts 60 days: this renews
#   it, and when Instagram hands back a new key saves it as INSTAGRAM_TOKEN
#   with a GitHub key that may change this repository's secrets
#   (GH_SECRETS_TOKEN). docs/INSTAGRAM-SETUP.md, step 5.

on:
  schedule:
    - cron: '37 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check how long the key lasts; renew and save it if it is the Instagram kind
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$INSTAGRAM_TOKEN" ]; then echo "Instagram is not set up yet; nothing to renew"; exit 0; fi
          umask 077
          rm -f /tmp/instagram-token
          python3 engine/instagram.py refresh --out /tmp/instagram-token
          if [ -s /tmp/instagram-token ]; then
            if [ -z "$GH_SECRETS_TOKEN" ]; then
              rm -f /tmp/instagram-token
              echo "::error::Instagram gave a new key but GitHub cannot save it: add GH_SECRETS_TOKEN (docs/INSTAGRAM-SETUP.md, step 5)"
              exit 1
            fi
            GH_TOKEN="$GH_SECRETS_TOKEN" gh secret set INSTAGRAM_TOKEN --repo "$REPO" < /tmp/instagram-token
            rm -f /tmp/instagram-token
            echo "the new key is saved"
          fi
