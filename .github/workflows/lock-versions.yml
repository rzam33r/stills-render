name: Record the versions that make a film

# Run by hand. Installs, on the same system the film runs on, exactly what
# a film run installs, and prints every version that arrived. Those lists
# are kept in locks/ and every film installs from them, so a new release of
# the voice, the cut-out AI or the browser cannot change a film without
# anyone choosing it. To move to newer versions: run this, read the lists,
# replace the files in locks/, make a test film.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: voice
        run: |
          python3 --version
          python3 -m venv /tmp/voice
          /tmp/voice/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/voice/bin/pip install -q kokoro soundfile
          echo "=== voice.txt ==="; /tmp/voice/bin/pip freeze; echo "=== end ==="
      - name: hindi voice (Chatterbox) and word timing (IndicWav2Vec)
        run: |
          python3 -m venv /tmp/cbx
          /tmp/cbx/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/cbx/bin/pip install -q "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox@ab55923c27757c90cfcc407baa57dc25a7d25217" --extra-index-url https://download.pytorch.org/whl/cpu
          echo "=== voice-chatterbox.txt ==="; /tmp/cbx/bin/pip freeze; echo "=== end ==="
          /tmp/cbx/bin/python - <<'PY'
          from huggingface_hub import HfApi
          api = HfApi()
          print('=== models ===')
          for repo in ('ResembleAI/chatterbox', 'ResembleAI/Chatterbox-Multilingual-hi', 'ai4bharat/indicwav2vec-hindi'):
              i = api.model_info(repo, expand=['sha', 'cardData', 'gated'])
              print(repo, i.sha, (i.card_data or {}).get('license'), 'gated' if i.gated else 'open')
          print('=== end ===')
          PY
      - name: azure voice
        run: |
          python3 -m venv /tmp/azure
          /tmp/azure/bin/pip install -q azure-cognitiveservices-speech
          echo "=== voice-azure.txt ==="; /tmp/azure/bin/pip freeze; echo "=== end ==="
      - name: pictures
        run: |
          python3 -m venv /tmp/pics
          /tmp/pics/bin/pip install -q pillow numpy scipy rembg onnxruntime
          echo "=== pictures.txt ==="; /tmp/pics/bin/pip freeze; echo "=== end ==="
      - name: browser
        run: |
          mkdir -p /tmp/web && cd /tmp/web && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core playwright >/dev/null
          echo "=== browser ==="; npm ls --depth=0; echo "=== end ==="
